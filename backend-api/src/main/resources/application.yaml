spring:
  application:
    name: home-webpage

  datasource:
    url: jdbc:postgresql://localhost:5432/home_webpage
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO

springdoc:
  enable-data-rest: false
  enable-hateoas: false
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui
    display-request-duration: true
    operationsSorter: method
    tagsSorter: alpha

app:
  cors:
    paths:
      - /**
    allowed-origins:
      - https://pavel-usanli.online/
      - https://www.pavel-usanli.online/
      - https://blog.pavel-usanli.online/
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: false
    max-age: 3600
  openapi:
    title: Personal Page API
    description: Simple API for my personal page
    version: 0.0.1
    contact:
      name: Pavel Usanli
      url: https://pavel-usanli.online/
    servers:
      - url: https://api.pavel-usanli.online/personal-page/v1/