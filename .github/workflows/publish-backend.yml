name: Build and Publish Back End Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend-api/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven tidy check
        working-directory: backend-api
        run: mvn -B tidy:pom

      - name: Maven format check
        working-directory: backend-api
        run: mvn -B fmt:check

      - name: Maven test with coverage (JaCoCo)
        working-directory: backend-api
        run: mvn -B test jacoco:report

      - name: Maven SonarQube report
        working-directory: backend-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B sonar:sonar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (Spring Boot)
        working-directory: backend-api
        run: |
          mvn -B -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName=kalpak44/personal-web-page-api:latest

      - name: Tag image with short sha
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag kalpak44/personal-web-page-api:latest kalpak44/personal-web-page-api:${SHORT_SHA}

      - name: Push images
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker push kalpak44/personal-web-page-api:latest
          docker push kalpak44/personal-web-page-api:${SHORT_SHA}
