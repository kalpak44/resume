name: Frontend Build and Publish

on:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend-app/**"
      - ".github/workflows/publish-frontend.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "frontend-app/**"
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-app/frontend-app/package-lock.json

      - name: Install dependencies
        working-directory: frontend-app/frontend-app
        run: npm ci

      - name: Check formatting
        working-directory: frontend-app/frontend-app
        run: npm run format:check

      - name: Run linter
        working-directory: frontend-app/frontend-app
        run: npm run lint

  publish-frontend:
    needs: lint-and-format
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA (no prefix)
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.vars.outputs.sha_short }}

      - name: Build and push Docker image (multi-platform)
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-app
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate build report
        run: |
          echo "### Docker Image Build Report 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Successfully built and pushed the image to GHCR." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** \`linux/amd64\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- |" >> $GITHUB_STEP_SUMMARY

          while IFS= read -r tag; do
            [ -n "$tag" ] && echo "| \`$tag\` |" >> $GITHUB_STEP_SUMMARY
          done <<< "${{ steps.meta.outputs.tags }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
