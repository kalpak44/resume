# Managed by homelab-infra — terraform/github/<repo>/workflows/ai-pr-agent.yml
# Edits made here in the target repo are overwritten by `just deploy github <repo>`.
#
# Reviews pull requests with DeepSeek and, on approval, arms auto-merge.
# Merging itself is still GitHub's decision: auto-merge waits for the branch rules.
#
# Triggers:
#   pull_request — automatic, bot-authored PRs only
#   workflow_dispatch — manual sweep of every open PR, oldest first. Review always
#                       runs; auto-merge is still armed for bot-authored PRs only.
name: AI PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Produces the list of PR numbers to review, so both triggers share one code path.
  discover:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - id: list
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Automatic run: this PR only, and only if a bot opened it.
            case "${{ github.event.pull_request.user.login }}" in
              'dependabot[bot]'|'renovate[bot]')
                PRS='[${{ github.event.pull_request.number }}]' ;;
              *)
                PRS='[]' ;;
            esac
          else
            # Manual sweep: every open PR, oldest first. Capped at 100 — see the
            # count echoed below if you ever have more than that open at once.
            PRS=$(gh api \
              "repos/$REPO/pulls?state=open&sort=created&direction=asc&per_page=100" \
              --jq '[.[].number]')
          fi
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"
          echo "reviewing $(echo "$PRS" | jq 'length') PR(s): $PRS"

  review:
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Sequential, in creation order, and one bad PR must not abort the rest.
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ matrix.pr }}
      REPO: ${{ github.repository }}

    steps:
      - name: Collect PR metadata and diff
        run: |
          set -euo pipefail
          # Read the PR over the API rather than the event payload, so a manual
          # dispatch (which has no pull_request context) takes the same path.
          gh api "repos/$REPO/pulls/$PR" > pr.json

          STATE=$(jq -r '.state' pr.json)
          DRAFT=$(jq -r '.draft' pr.json)
          if [ "$STATE" != "open" ] || [ "$DRAFT" = "true" ]; then
            echo "PR #$PR is state=$STATE draft=$DRAFT — skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          {
            echo "PR_TITLE=$(jq -r '.title' pr.json)"
            echo "PR_AUTHOR=$(jq -r '.user.login' pr.json)"
          } >> "$GITHUB_ENV"

          gh pr diff "$PR" --repo "$REPO" > pr.diff
          # DeepSeek's context is finite; a truncated diff still shows what changed.
          head -c 60000 pr.diff > pr.trunc.diff
          echo "PR #$PR — diff bytes: $(wc -c < pr.diff) (sent: $(wc -c < pr.trunc.diff))"

      - name: Ask DeepSeek for a verdict
        if: env.SKIP != 'true'
        env:
          DEEPSEEK_APIKEY: ${{ secrets.DEEPSEEK_APIKEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
        run: |
          set -euo pipefail

          if [ -z "${DEEPSEEK_APIKEY:-}" ]; then
            echo "DEEPSEEK_APIKEY is empty — is it set in the Dependabot secret store too?" >&2
            exit 1
          fi

          read -r -d '' SYSTEM <<'EOF' || true
          You review automated dependency-update pull requests. You are the only reviewer;
          approving means the change merges without a human looking at it.

          Approve only when all of the following hold:
            - the diff touches nothing but dependency manifests and lockfiles
            - the version change is a patch or minor bump of an existing dependency
            - no new dependency is introduced, and no build/CI/script content changes

          Reject anything else, including major bumps, removed pins, changed registries,
          modified workflows or build scripts, and any diff you cannot fully account for.
          When in doubt, reject.

          Reply with JSON only: {"verdict":"approve"|"reject","summary":"<=400 chars","risks":["..."]}
          EOF

          jq -n \
            --arg model "$DEEPSEEK_MODEL" \
            --arg system "$SYSTEM" \
            --arg title "$PR_TITLE" \
            --rawfile diff pr.trunc.diff \
            '{
              model: $model,
              temperature: 0,
              response_format: { type: "json_object" },
              messages: [
                { role: "system", content: $system },
                { role: "user", content: ("PR title: " + $title + "\n\nDiff:\n" + $diff) }
              ]
            }' > request.json

          curl -sS --fail-with-body \
            https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_APIKEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json

          jq -r '.choices[0].message.content' response.json > verdict.json
          echo "--- verdict for PR #$PR ---"
          cat verdict.json

      - name: Post the review
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          VERDICT=$(jq -r '.verdict // "reject"' verdict.json)
          SUMMARY=$(jq -r '.summary // "no summary returned"' verdict.json)
          RISKS=$(jq -r '(.risks // []) | map("- " + .) | join("\n")' verdict.json)

          # Auto-merge stays bot-only regardless of trigger, so a manual sweep can
          # review human PRs without ever merging one.
          case "$PR_AUTHOR" in
            'dependabot[bot]'|'renovate[bot]') MERGEABLE=yes ;;
            *)                                 MERGEABLE=no  ;;
          esac

          {
            echo "### AI PR Agent — \`$VERDICT\`"
            echo
            echo "$SUMMARY"
            if [ -n "$RISKS" ]; then
              echo
              echo "**Risks**"
              echo "$RISKS"
            fi
            if [ "$VERDICT" = "approve" ] && [ "$MERGEABLE" = "no" ]; then
              echo
              echo "_Author \`$PR_AUTHOR\` is not a bot — reviewed only, auto-merge not armed._"
            fi
          } > body.md

          # The verdict always goes on the PR as a comment. We deliberately do NOT call
          # `gh pr review --approve`: GITHUB_TOKEN is barred from approving PRs
          # ("GitHub Actions is not permitted to approve pull requests"), and even where
          # that setting is lifted, a GITHUB_TOKEN approval doesn't satisfy a required-
          # review rule. Auto-merge doesn't need an approval, so we skip it.
          gh pr comment "$PR" --repo "$REPO" --body-file body.md

          if [ "$VERDICT" = "approve" ] && [ "$MERGEABLE" = "yes" ]; then
            # --auto merges once the branch rules are satisfied; with no rules
            # configured GitHub merges immediately.
            gh pr merge "$PR" --repo "$REPO" --auto --squash
            echo "PR #$PR: commented and armed auto-merge"
          else
            echo "PR #$PR: commented only (verdict=$VERDICT, bot-authored=$MERGEABLE)"
          fi