name: Publish Blog API Docker

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "blog-api/**"
      - ".github/workflows/publish-blog-api-docker.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (Spring Boot)
        working-directory: blog-api
        run: |
          ./mvnw -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName=kalpak44/blog_api:latest

      - name: Tag image with short sha
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker tag kalpak44/blog_api:latest kalpak44/blog_api:${SHORT_SHA}

      - name: Push images
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker push kalpak44/blog_api:latest
          docker push kalpak44/blog_api:${SHORT_SHA}