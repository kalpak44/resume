<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Pavel Usanli — Software Engineer</title>

    <!-- Vendor CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- App CSS -->
    <link rel="stylesheet" href="./css/styles.css"/>
</head>

<body>
<div class="container my-5 page">

    <!-- Header -->
    <div class="topbar">
        <div class="row g-4 align-items-center">

            <!-- Avatar -->
            <div class="col-12 col-md-auto text-center text-md-start">
                <img id="avatar" src="./assets/profile.jpg" alt="Profile" class="avatar"/>
            </div>

            <!-- Main -->
            <div class="col-12 col-md text-center text-md-start">
                <div class="header-main">
                    <div class="header-info">
                        <h1 id="name" class="name"></h1>
                        <p id="role" class="role"></p>
                    </div>

                    <!-- Meta -->
                    <div id="meta" class="meta mt-3"></div>
                </div>

                <!-- Theme Toggle -->
                <button
                        id="themeToggle"
                        type="button"
                        class="btn btn-outline-secondary btn-theme"
                        aria-label="Toggle color theme"
                        title="Toggle theme"
                >
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>

                <div id="headerButtons" class="mt-4 d-flex flex-wrap justify-content-center justify-content-md-start gap-2"></div>
            </div>
        </div>
    </div>

    <!-- Summary -->
    <div class="card-flat mt-4">
        <div class="section-title">Summary</div>
        <p id="summary" class="mb-0 summary-text"></p>
    </div>

    <!-- Experience -->
    <div class="card-flat mt-4">
        <div class="section-title">Experience</div>
        <div id="experience"></div>
    </div>

    <!-- Education -->
    <div class="card-flat mt-4">
        <div class="section-title">Education</div>
        <div id="education"></div>
    </div>

    <div class="text-center text-muted mt-4 footer-note">
        © <span id="y"></span> <span id="footerName"></span>
    </div>
</div>

<!-- Scripts -->
<script src="./js/main.js" defer></script>
<script src="./js/render.js" defer></script>
</body>
</html>
